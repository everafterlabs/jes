# Pinned sources. review = "accepted" is required before a row is loaded.
# CI does not read these URLs. Raw text is never committed.
#
# Reviewed 2026-09-26 from the upstream LICENSE files at the pinned revisions.
# The development cohort was sent to TypeSafe. Its ids are burned.
# The holdout fifth and the BIPIA test files are reserved and were not sent.
# Audit is not opened. Ranking waits for a second finalist.

[lock]
audit_opened = false
id_list = "evals/split_lock.json"
id_sha256 = "16e76cc5245e11f16c00264420fbf79e43bd4d7c814d07f4efd58be45a9fbb95"
