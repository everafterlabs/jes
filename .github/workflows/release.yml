name: Publish functional release

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33

  docs:
    needs: publish
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Rebuild docs.getjes.dev
        env:
          DOCS_DEPLOY_HOOK: ${{ secrets.DOCS_DEPLOY_HOOK }}
        run: |
          if [ -z "$DOCS_DEPLOY_HOOK" ]; then
            echo "DOCS_DEPLOY_HOOK is not set; skipping the docs rebuild."
            exit 0
          fi
          curl -fsS -X POST "$DOCS_DEPLOY_HOOK" > /dev/null
