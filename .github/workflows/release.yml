name: Publish functional release

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086

  docs:
    needs: publish
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Rebuild docs.getjes.dev
        env:
          DOCS_DEPLOY_HOOK: ${{ secrets.DOCS_DEPLOY_HOOK }}
        run: |
          if [ -z "$DOCS_DEPLOY_HOOK" ]; then
            echo "DOCS_DEPLOY_HOOK is not set; skipping the docs rebuild."
            exit 0
          fi
          curl -fsS -X POST "$DOCS_DEPLOY_HOOK" > /dev/null
