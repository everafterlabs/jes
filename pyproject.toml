[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "jes"
version = "1.0.0"
description = "A policy engine for checking text around language models"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "jes contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
crypto = ["cryptography>=43"]
pii = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2", "idna>=3.6,<4"]
pii-ner = [
  "presidio-analyzer[transformers]>=2.2",
  "presidio-anonymizer>=2.2",
  "idna>=3.6,<4",
  "transformers>=4.40",
]
json = ["json-repair>=0.30"]
laya = ["laya>=0.1"]
litellm = ["litellm>=1.50,<2"]
llama-guard = ["transformers>=4.40,<6", "torch>=2.2"]
prompt-guard = ["transformers>=4.40,<6", "torch>=2.2"]
regex = ["regex>=2024.11.6"]
secrets = ["detect-secrets>=1.5"]
tokenizers = ["tokenizers>=0.19,<1"]
tokens = ["tiktoken>=0.8,<1"]

[project.urls]
Documentation = "https://github.com/henbenmoshe/jes"
Repository = "https://github.com/henbenmoshe/jes"
Issues = "https://github.com/henbenmoshe/jes/issues"

[dependency-groups]
dev = [
  "cryptography>=43",
  "detect-secrets>=1.5",
  "hypothesis>=6.130",
  "idna>=3.6,<4",
  "presidio-analyzer>=2.2",
  "presidio-anonymizer>=2.2",
  "pyright>=1.1.400",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6",
  "regex>=2024.11.6",
  "ruff>=0.11",
  "tiktoken>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["jes"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"jes/policies/_ucd_data.py" = ["E501", "RUF001", "RUF002", "RUF003"]
"jes/policies/_confusables_data.py" = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.pyright]
include = ["jes", "evals"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"
reportPrivateUsage = "none"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=jes --cov-report=term-missing --cov-branch"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["jes"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
