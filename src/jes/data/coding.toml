# Coding-agent profile. Copy this file to a path you own.
# jes does not load it until you pass --profile, set JES_PROFILE,
# or copy it to $XDG_CONFIG_HOME/jes/profile.toml (usually ~/.config/jes/profile.toml).
#
# threshold is required. It is the block line for every policy below.
# model is required. It is the decision model those policies call.

model = "jev-latest"
threshold = 0.5

# Optional shorter hazard list. Omit the key to ask every S1–S14 category.
# A shorter list still includes the hazards summary question.
# The reply check is the expensive call, so a short list costs less.
# hazards = ["S1", "S14"]

# Optional tool-name gate. Omit the key, or leave the list empty, to allow every name.
# allowed_tools = ["Read", "Edit", "Grep", "Bash"]

# Claude Code limits. JSON settings cannot carry comments, so they are repeated
# in the limits array of jes/data/claude-settings.json (jes claude-settings).
# PostToolUse fires after the tool has already run. A blocked result keeps the
# model from reading it. It does not undo a shell command or a file write.
# That is what PreToolUse is for.
# MessageDisplay changes the text on screen only. The transcript, and what
# Claude sees on the next turn, keep the original reply. Exit code 2 does not
# block this event.
# A PostToolUse or MessageDisplay process that dies before printing JSON fails
# open. The CLI still catches judge errors and prints a refusal so a Jev
# failure is not a silent allow.
